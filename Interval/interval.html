<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval</title>
    <script src="interval.js"></script>
    <style>
 body{
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    background-color: brown;
 }
 body > div{
    border: none;
    border-radius: 20px;
    padding: 25px 30px;

 }
 div > button{
padding: 8px 16px;
border-radius: 10px;
 }

</head>
<body>
    <div>
        <button id="start" onclick="startClock()">Start</button>
        <button id="stop" onclick="stopClock()">Stop</button>
        <p id="demo"></p>
    </div>
</body>
</html>
